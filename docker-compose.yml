services:
    app:
        image: jeongjaewon1/study-mate:latest
        container_name: study-mate-app
        restart: unless-stopped
        env_file: .env
        environment:
            - NODE_ENV=production
        # ---- 보안 하드닝 ----
        read_only: true
        tmpfs:
            - /tmp:noexec,nosuid,size=256M
            - /app/.next/cache:size=256M
        security_opt:
            - no-new-privileges:true
        cpus: 1.5
        mem_limit: 512m
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'wget -q --spider http://127.0.0.1:3000/ || exit 1',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'

    # 배포 자동화 전까지 사용
    # build:
    #     context: .
    #     dockerfile: Dockerfile
    #     args:
    #         NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
    #         NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    #         NEXT_PUBLIC_STORAGE_BUCKET_POST: ${NEXT_PUBLIC_STORAGE_BUCKET_POST}
    #         NEXT_PUBLIC_STORAGE_BUCKET_PROFILE: ${NEXT_PUBLIC_STORAGE_BUCKET_PROFILE}
    # container_name: study-mate-app
    # restart: unless-stopped
    # env_file: .env
    # environment:
    #     - NODE_ENV=production

    nginx:
        image: nginx:alpine
        container_name: study-mate-nginx
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
            - /etc/letsencrypt:/etc/letsencrypt:ro
        depends_on:
            - app
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'
