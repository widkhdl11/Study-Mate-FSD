name: Security Check

# 자동 실행 비활성화(배포 안정화 후 재활성 예정). 수동 실행(workflow_dispatch)만 남김.
# 재활성: 아래 push/pull_request/schedule 트리거 주석 해제.
on:
    workflow_dispatch:
    # push:
    #     branches: [main]
    # pull_request:
    # schedule:
    #     - cron: '0 0 * * 1' # 매주 월요일 09:00 KST

jobs:
    audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Audit production dependencies
              run: npm audit --omit=dev --audit-level=high
              continue-on-error: true # 실패해도 빌드는 계속

            - name: Build
              run: npm run build
